<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f1420">
<title>Bulletproof 打卡</title>
<style>
:root{--bg:#0f1420;--card:#1a2232;--card2:#212b40;--line:#2e3a54;--txt:#e8ecf4;--dim:#8fa0bd;--acc:#4f8ef7;--good:#3ddc84;--warn:#ffb347;--bad:#ff6b6b;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,"PingFang HK","Noto Sans TC",sans-serif;font-size:16px;padding-bottom:80px;}
header{padding:16px 16px 8px;position:sticky;top:0;background:var(--bg);z-index:5;display:flex;justify-content:space-between;align-items:flex-start;}
h1{font-size:20px;} .sub{color:var(--dim);font-size:13px;margin-top:2px;}
#btnEdit{background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:99px;padding:7px 14px;font-size:13px;font-family:inherit;}
#btnEdit.on{background:var(--warn);color:#0f1420;font-weight:700;border-color:var(--warn);}
.tabs{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);z-index:10;padding-bottom:env(safe-area-inset-bottom);}
.tabs button{flex:1;background:none;border:none;color:var(--dim);padding:12px 4px;font-size:13px;font-family:inherit;}
.tabs button.on{color:var(--acc);font-weight:700;}
.page{display:none;padding:0 14px;} .page.on{display:block;}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0;}
.card h2{font-size:15px;margin-bottom:4px;display:flex;justify-content:space-between;align-items:center;gap:6px;}
.tag{font-size:11px;color:var(--dim);font-weight:400;}
.goal{font-size:12px;color:var(--dim);margin-bottom:8px;}
.item{display:flex;align-items:center;gap:10px;padding:9px 8px;border-radius:10px;}
.item:active{background:var(--card2);}
.item .box{width:26px;height:26px;min-width:26px;border-radius:7px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:15px;color:#0f1420;}
.item.done .box{background:var(--good);border-color:var(--good);}
.item.done .nm{color:var(--dim);text-decoration:line-through;}
.item .mid{flex:1;min-width:0;}
.item .nm{font-size:15px;} .item .rx{font-size:12px;color:var(--dim);}
.item .chev{color:var(--dim);font-size:16px;}
.item .hasinfo{font-size:11px;color:var(--acc);}
.ebtn{background:var(--card2);border:1px solid var(--line);border-radius:8px;color:var(--txt);font-size:14px;padding:5px 9px;font-family:inherit;}
.addbtn{display:block;width:100%;background:none;border:1px dashed var(--line);border-radius:10px;color:var(--dim);padding:10px;font-size:14px;font-family:inherit;margin-top:6px;}
.prog{height:6px;background:var(--card2);border-radius:3px;margin:8px 0 2px;overflow:hidden;}
.prog i{display:block;height:100%;background:var(--acc);border-radius:3px;transition:width .3s;}
.row{display:flex;gap:10px;align-items:center;margin:10px 0;}
.row label{flex:1;font-size:14px;}
input[type=range]{flex:2;accent-color:var(--acc);}
.val{width:34px;text-align:center;font-weight:700;font-size:17px;}
.feel{display:flex;gap:8px;margin:8px 0;}
.feel button{flex:1;font-size:22px;background:var(--card2);border:2px solid var(--line);border-radius:10px;padding:8px 0;}
.feel button.on{border-color:var(--acc);background:#233250;}
textarea{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:10px;color:var(--txt);padding:10px;font-family:inherit;font-size:15px;min-height:64px;}
.switch{display:flex;justify-content:space-between;align-items:center;padding:4px 2px;}
.sw{width:50px;height:30px;border-radius:15px;background:var(--card2);border:1px solid var(--line);position:relative;transition:.2s;}
.sw i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--dim);transition:.2s;}
.sw.on{background:var(--acc);} .sw.on i{left:23px;background:#fff;}
.big{font-size:32px;font-weight:800;} .stat{text-align:center;flex:1;}
.stat .lb{font-size:12px;color:var(--dim);margin-top:2px;}
.grid30{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:8px;}
.grid30 div{aspect-ratio:1;border-radius:6px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--dim);}
canvas{width:100%;height:160px;}
.btn{display:block;width:100%;background:var(--acc);color:#fff;border:none;border-radius:12px;padding:13px;font-size:16px;font-weight:700;font-family:inherit;margin:10px 0;}
.btn.ghost{background:var(--card2);color:var(--txt);border:1px solid var(--line);}
select,input[type=number],input[type=text]{background:var(--card2);border:1px solid var(--line);border-radius:8px;color:var(--txt);padding:8px;font-size:15px;font-family:inherit;}
.lvhead{display:flex;justify-content:space-between;align-items:center;}
.pill{font-size:12px;padding:3px 10px;border-radius:99px;border:1px solid var(--line);color:var(--dim);}
.pill.now{background:var(--acc);color:#fff;border-color:var(--acc);}
.hist{font-size:13px;color:var(--dim);border-top:1px solid var(--line);padding:8px 2px;}
.note{font-size:12px;color:var(--dim);margin-top:6px;line-height:1.5;}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;}
.chips button{background:var(--card2);border:1px solid var(--line);border-radius:99px;color:var(--dim);padding:6px 12px;font-size:14px;font-family:inherit;}
.chips button.on{background:var(--acc);color:#fff;border-color:var(--acc);}
#toast{position:fixed;bottom:76px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--good);color:#0f1420;font-weight:700;font-size:14px;padding:8px 18px;border-radius:99px;opacity:0;transition:.25s;pointer-events:none;z-index:50;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
#ovl{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:none;}
#ovl.on{display:block;}
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:88vh;overflow-y:auto;background:var(--card);border-radius:20px 20px 0 0;border-top:1px solid var(--line);z-index:21;padding:16px 16px calc(24px + env(safe-area-inset-bottom));transform:translateY(105%);transition:.28s;}
#sheet.on{transform:translateY(0);}
#sheet h3,#sheet2 h3{font-size:18px;display:flex;justify-content:space-between;align-items:center;}
#ovl2{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:30;display:none;}
#ovl2.on{display:block;}
#sheet2{position:fixed;left:0;right:0;bottom:0;max-height:90vh;overflow-y:auto;background:var(--card);border-radius:20px 20px 0 0;border-top:1px solid var(--line);z-index:31;padding:16px 16px calc(24px + env(safe-area-inset-bottom));transform:translateY(105%);transition:.28s;}
#sheet2.on{transform:translateY(0);}
#ovl3{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;display:none;}
#ovl3.on{display:block;}
#sheet3{position:fixed;left:0;right:0;bottom:0;max-height:92vh;overflow-y:auto;background:var(--card2);border-radius:20px 20px 0 0;border-top:1px solid var(--acc);z-index:41;padding:16px 16px calc(24px + env(safe-area-inset-bottom));transform:translateY(105%);transition:.28s;}
#sheet3.on{transform:translateY(0);}
#sheet3 h3{font-size:18px;display:flex;justify-content:space-between;align-items:center;}
#s3Close{background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:99px;width:32px;height:32px;font-size:16px;flex-shrink:0;}
.mpick button{position:relative;}
.mpick button .ord{position:absolute;top:-6px;right:-4px;background:var(--acc);color:#fff;font-size:10px;font-weight:700;width:16px;height:16px;border-radius:50%;line-height:16px;}
#mClose,#s2Close{background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:99px;width:32px;height:32px;font-size:16px;flex-shrink:0;}
.imgs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px;}
.imgs img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;border:1px solid var(--line);}
.addimg{aspect-ratio:1;border:1px dashed var(--line);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--dim);font-size:13px;gap:4px;}

/* ===== 力量 / 分析 ===== */
.tabs button{font-size:12px;padding:11px 2px;}
.lift{border-top:1px solid var(--line);padding:11px 2px;}
.lift:first-of-type{border-top:none;}
.lift .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
.lift .lname{font-size:15px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.lift .now{font-size:20px;font-weight:800;color:var(--txt);white-space:nowrap;}
.lift .meta{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--dim);margin-top:3px;align-items:center;}
.mtags{display:flex;gap:4px;flex-wrap:wrap;}
.mtag{font-size:10px;padding:2px 7px;border-radius:99px;background:var(--card2);border:1px solid var(--line);color:var(--dim);}
.spark{width:100%;height:34px;display:block;margin-top:6px;}
.deltaUp{color:var(--good);} .deltaDn{color:var(--bad);} .deltaEq{color:var(--dim);}
.tprog{height:5px;background:var(--card2);border-radius:3px;margin-top:6px;overflow:hidden;}
.tprog i{display:block;height:100%;background:var(--warn);border-radius:3px;}
.seg{display:flex;background:var(--card2);border:1px solid var(--line);border-radius:99px;padding:3px;gap:3px;margin:10px 0;}
.seg button{flex:1;background:none;border:none;color:var(--dim);border-radius:99px;padding:7px 4px;font-size:13px;font-family:inherit;}
.seg button.on{background:var(--acc);color:#fff;font-weight:700;}
.mrow{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:13px;}
.mrow .mn{width:46px;color:var(--dim);flex-shrink:0;}
.mrow .mb{flex:1;height:16px;background:var(--card2);border-radius:4px;overflow:hidden;position:relative;display:flex;}
.mrow .mb i{display:block;height:100%;border-radius:4px 0 0 4px;}
.mrow .mb u{display:block;height:100%;background:#3a4763;opacity:.55;text-decoration:none;}
.mrow .mv{width:62px;text-align:right;color:var(--dim);font-size:11px;flex-shrink:0;}
.warnbox{border-radius:10px;padding:9px 11px;font-size:13px;margin:7px 0;line-height:1.5;border:1px solid;}
.warnbox.bad{background:#3a1f22;border-color:#6b2f34;color:#ffb9b9;}
.warnbox.warn{background:#3a3020;border-color:#6b5528;color:#ffd9a0;}
.warnbox.ok{background:#1d3326;border-color:#2c5c3c;color:#a8e6c0;}
.modbar{display:flex;height:24px;border-radius:6px;overflow:hidden;margin-top:8px;background:var(--card2);}
.modbar span{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#0f1420;}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--dim);margin-top:7px;}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:baseline;}
.exrow{display:flex;gap:6px;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:14px;}
.exrow .en{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.exrow .ev{color:var(--dim);font-size:13px;white-space:nowrap;}
.exrow .del{background:none;border:none;color:var(--bad);font-size:15px;padding:2px 4px;}
.mini{font-size:12px;padding:6px 11px;border-radius:8px;background:var(--card2);border:1px solid var(--line);color:var(--txt);font-family:inherit;}
.mini.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700;}
.btnrow{display:flex;gap:8px;margin-top:10px;}
.btnrow button{flex:1;}
#ocrLog{font-size:12px;color:var(--dim);white-space:pre-wrap;max-height:120px;overflow:auto;margin-top:8px;line-height:1.5;}
.srch{width:100%;margin:6px 0 2px;}
.hm{width:100%;height:auto;display:block;margin-top:6px;}
.hm .reg{stroke:var(--line);stroke-width:1.2;}
.hm text{fill:var(--dim);font-size:9px;font-family:-apple-system,sans-serif;}
.empty{color:var(--dim);font-size:13px;text-align:center;padding:18px 8px;line-height:1.6;}
.kv{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-top:1px solid var(--line);}
.kv b{font-weight:700;}
</style>
</head>
<body>
<header>
<div><h1>Bulletproof 打卡</h1><div class="sub" id="hDate"></div></div>
<button id="btnEdit">✏️ 編輯計劃</button>
</header>

<div class="page on" id="pg-today"></div>
<div class="page" id="pg-lift"></div>
<div class="page" id="pg-prog"></div>
<div class="page" id="pg-assess"></div>
<div class="page" id="pg-level"></div>

<div class="tabs">
<button class="on" data-pg="today">✅ 今日</button>
<button data-pg="lift">🏋️ 力量</button>
<button data-pg="prog">📈 進度</button>
<button data-pg="assess">📋 評估</button>
<button data-pg="level">🏆 等級</button>
</div>

<div id="toast">✅ 已儲存</div>
<div id="ovl"></div>
<div id="sheet">
<h3><span id="mTitle"></span><button id="mClose">✕</button></h3>
<div class="sub" id="mRx"></div>
<div class="goal" style="margin-top:12px">📝 動作說明 / 貼士（自動儲存）</div>
<textarea id="mDesc" placeholder="例：手肘貼身，拉到面前，收尾夾背2秒…"></textarea>
<div class="goal" style="margin-top:12px">📷 示範相片（撳相可刪除）</div>
<div class="imgs" id="mImgs"></div>
<div class="note">相片存喺電話入面（唔包括喺JSON備份）。</div>
</div>

<div id="ovl2"></div>
<div id="sheet2">
<h3><span id="s2Title"></span><button id="s2Close">✕</button></h3>
<div id="s2Body"></div>
</div>

<div id="ovl3"></div>
<div id="sheet3">
<h3><span id="s3Title"></span><button id="s3Close">✕</button></h3>
<div id="s3Body"></div>
</div>

<script>
"use strict";
/* ---------- 預設計劃（第一次用先會載入，之後全部可自己改） ---------- */
function defaultPlan(){ return {
 corrDays:[2,6],
 daily:[
  {id:"p1",name:"Phase 1 · Reset Mobility",tag:"2分鐘",goal:"胸椎打開，準備訓練",items:[
   {id:"p1a",name:"Foam Roller Thoracic Extension",rx:"×8"},{id:"p1b",name:"Open Book",rx:"左右各8"}]},
  {id:"p2",name:"Phase 2 · Shoulder Stability",tag:"5分鐘",goal:"左肩唔夾擠 · Front Rack · Pull-up 用背",items:[
   {id:"p2a",name:"Face Pull",rx:"2×15"},{id:"p2b",name:"Band External Rotation",rx:"2×15"},{id:"p2c",name:"Serratus Wall Slide",rx:"2×10"}]},
  {id:"p3",name:"Phase 3 · ECU Bulletproof",tag:"4分鐘",goal:"ECU 承受 Pull-up / Carry / Row",items:[
   {id:"p3a",name:"Forearm Rotation ROM",rx:"2×15"},{id:"p3b",name:"ECU Isometric",rx:"5×30秒"},{id:"p3c",name:"Finger Extension",rx:"2×20"}]},
  {id:"p4",name:"Phase 4 · Lower Chain",tag:"4分鐘",goal:"小腿唔再代償",items:[
   {id:"p4a",name:"Single-leg Glute Bridge",rx:"2×12"},{id:"p4b",name:"Monster Walk",rx:"2×15步"},{id:"p4c",name:"Short Foot",rx:"3×30秒"}]}],
 corr:[
  {id:"bA",name:"Block A · 肩胛",tag:"8分鐘",goal:"",items:[
   {id:"bA1",name:"Scapular Pull-up（只郁肩胛，唔屈手）",rx:"3×8"},{id:"bA2",name:"Prone Y（停2秒）",rx:"2×10"},{id:"bA3",name:"Prone T",rx:"2×10"},{id:"bA4",name:"Bottom-up Carry（無KB改單手Overhead Carry）",rx:"3×20m"}]},
  {id:"bB",name:"Block B · Rotator Cuff",tag:"6分鐘",goal:"",items:[
   {id:"bB1",name:"Side Lying ER",rx:"3×12"},{id:"bB2",name:"Face Pull",rx:"2×20"},{id:"bB3",name:"Band W",rx:"2×15"}]},
  {id:"bC",name:"Block C · Forearm",tag:"8分鐘",goal:"",items:[
   {id:"bC1",name:"Wrist Extension Eccentric（2–4kg，3秒下降）",rx:"3×15"},{id:"bC2",name:"Pronation / Supination（Hammer）",rx:"3×12"},{id:"bC3",name:"Offset Carry（單手）",rx:"4×20–30秒"},{id:"bC4",name:"Rice Bucket（如果有）",rx:"1分鐘"}]},
  {id:"bD",name:"Block D · 臀",tag:"8分鐘",goal:"",items:[
   {id:"bD1",name:"Bulgarian Split Squat",rx:"3×8"},{id:"bD2",name:"Single-leg RDL",rx:"3×8"},{id:"bD3",name:"Copenhagen Plank",rx:"2×20秒"},{id:"bD4",name:"Tibialis Raise",rx:"2×20"}]},
  {id:"bE",name:"終身動作",tag:"每週保留",goal:"",items:[
   {id:"bE1",name:"Dead Hang Progression（ECU好返先開始 10–15秒×3）",rx:"每週2次"},{id:"bE2",name:"Turkish Get-up",rx:"每週1–2次"}]}],
 wu:[{id:"w1",name:"Face Pull",rx:"15"},{id:"w2",name:"Band ER",rx:"15"},{id:"w3",name:"Serratus Punch",rx:"15"},{id:"w4",name:"ECU Isometric",rx:"3×20秒"},{id:"w5",name:"ROM",rx:"10"}]
};}
const LEVELS = [
 {n:1,name:"Level 1 · 而家",items:["ROM","Isometric","Row","Ski","Sled Push"]},
 {n:2,name:"Level 2",items:["Bench","Deadlift","Wall Ball","KB Swing"]},
 {n:3,name:"Level 3",items:["Farmer Carry","Hang","Scap Pull-up","Band Pull-up"]},
 {n:4,name:"Level 4",items:["Strict Pull-up","Chest-to-bar","Ring Dip","Muscle-up"]}];
const FEELS = ["😫","😕","😐","🙂","💪"];
const WD = "日一二三四五六";

/* ---------- 儲存 ---------- */
const KEY = "bulletproof_v1";
let DB = {days:{}, assessments:[], level:1, levelChecks:{}, plan:null, ex:{}};
try { const raw = localStorage.getItem(KEY); if (raw) DB = Object.assign(DB, JSON.parse(raw)); } catch(e){}
if(!DB.plan) DB.plan = defaultPlan();
if(!DB.ex) DB.ex = {};
let toastT;
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg||"✅ 已儲存"; t.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),1100); }
function save(quiet){ try{ localStorage.setItem(KEY, JSON.stringify(DB)); if(!quiet) toast(); }catch(e){ alert("儲存失敗：容量可能滿咗，請匯出備份"); } }
function uid(){ return "x"+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function dkey(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
const today = new Date(), TKEY = dkey(today);
function day(k){ if(!DB.days[k]) DB.days[k] = {checks:{}, shoulder:null, ecu:null, feel:null, note:"", wod:false}; return DB.days[k]; }
const D = day(TKEY);
function isCorrDay(){ return DB.plan.corrDays.includes(today.getDay()); }
let editMode = false;

/* ---------- IndexedDB（相片） ---------- */
let idbP = null;
function idb(){
 if(!("indexedDB" in window)) return Promise.reject("no idb");
 if(!idbP) idbP = new Promise((res,rej)=>{ const r=indexedDB.open("bp_imgs",1);
  r.onupgradeneeded=()=>r.result.createObjectStore("imgs");
  r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); });
 return idbP;
}
function imgPut(k,v){ return idb().then(db=>new Promise((res,rej)=>{ const t=db.transaction("imgs","readwrite"); t.objectStore("imgs").put(v,k); t.oncomplete=res; t.onerror=()=>rej(t.error); })); }
function imgGet(k){ return idb().then(db=>new Promise((res,rej)=>{ const q=db.transaction("imgs").objectStore("imgs").get(k); q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); })); }
function imgDel(k){ return idb().then(db=>new Promise((res,rej)=>{ const t=db.transaction("imgs","readwrite"); t.objectStore("imgs").delete(k); t.oncomplete=res; t.onerror=()=>rej(t.error); })); }

/* ---------- 工具 ---------- */
function el(html){ const t=document.createElement("template"); t.innerHTML=html.trim(); return t.content.firstChild; }
function esc(s){ return String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
/* block 今日計唔計入完成率
   b.optIn = true  → 預設唔計，撳「今日要做」先計（適合每週得一兩次嘅動作）
   b.optIn = false → 預設計，撳走先唔計 */
function blockOn(k, b){
 const dd = DB.days[k] || {};
 return b.optIn ? !!(dd.on && dd.on[b.id]) : !(dd.skip && dd.skip[b.id]);
}

function drawChart(cv){
 const ctx = cv.getContext && cv.getContext("2d"); if(!ctx) return;
 const W=cv.width, H=cv.height, pad=30;
 ctx.clearRect(0,0,W,H);
 ctx.strokeStyle="#2e3a54"; ctx.lineWidth=1; ctx.font="20px sans-serif"; ctx.fillStyle="#8fa0bd";
 for(let v=0;v<=10;v+=5){
  const y = H-pad-(H-2*pad)*v/10;
  ctx.beginPath(); ctx.moveTo(pad,y); ctx.lineTo(W-8,y); ctx.stroke();
  ctx.fillText(v, 4, y+6);
 }
 const ks = last(30);
 function line(pid,color){
  const pts = [];
  ks.forEach((k,i)=>{
   const v = painGet(DB.days[k], pid);
   if(v==null) return;
   pts.push([pad+(W-pad-12)*i/29, H-pad-(H-2*pad)*v/10]);
  });
  if(!pts.length) return;
  ctx.strokeStyle=color; ctx.lineWidth=3; ctx.beginPath();
  pts.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));
  ctx.stroke();
  ctx.fillStyle=color;
  pts.forEach(q=>{ ctx.beginPath(); ctx.arc(q[0],q[1],5,0,7); ctx.fill(); });
 }
 PARTS().forEach(p=>line(p.id, p.c));
}

 pg.appendChild(el(`<div class="sub" style="padding:4px 2px">每月做一次（10分鐘），記低數據睇進步</div>`));
 const card = el(`<div class="card"><h2>新評估 · ${TKEY}</h2></div>`);
 const vals = {};
 ASSESS_FIELDS.forEach(([grp,id,label,type])=>{
  let ctrl;
  if(type==="yn"){
   ctrl = el(`<div class="row"><label>【${grp}】${label}</label><select><option value="">–</option><option value="✅">係</option><option value="❌">未得</option></select></div>`);
   ctrl.querySelector("select").onchange = function(){ vals[id]=this.value; };
  } else if(type==="num"){
   ctrl = el(`<div class="row"><label>【${grp}】${label}</label><input type="number" min="0" max="10" style="width:70px"></div>`);
   ctrl.querySelector("input").oninput = function(){ vals[id]=this.value; };
  } else if(type==="choice"){
   ctrl = el(`<div class="row"><label>【${grp}】${label}</label><select><option value="">–</option><option>小腿先攰</option><option>臀先攰</option><option>差唔多</option></select></div>`);
   ctrl.querySelector("select").onchange = function(){ vals[id]=this.value; };
  } else {
   ctrl = el(`<div class="row"><label>【${grp}】${label}</label><input type="text" style="width:120px" placeholder="例：左弱少少"></div>`);
   ctrl.querySelector("input").oninput = function(){ vals[id]=this.value; };
  }
  card.appendChild(ctrl);
 });
 const sv = el(`<button class="btn">💾 儲存今次評估</button>`);
 sv.onclick = ()=>{ DB.assessments.push({date:TKEY, ...vals}); save(); renderAssess(); };
 card.appendChild(sv);
 pg.appendChild(card);
 if(DB.assessments.length){
  const h = el(`<div class="card"><h2>歷史記錄</h2></div>`);
  [...DB.assessments].reverse().forEach(a=>{
   h.appendChild(el(`<div class="hist"><b>${a.date}</b> ｜ 左肩痛 ${a.shPain??"–"} · ECU ${a.ecuTest??"–"} · Dead Hang ${a.deadHang||"–"} · Farmer ${a.farmer||"–"} · Flexion對稱 ${a.shFlex||"–"} · Front Rack ${a.frontRack||"–"} · ${a.fatigue||""} ${esc(a.slsDiff||"")}</div>`));
  });
  pg.appendChild(h);
 }
}

function renderLevel(){
 const pg = document.getElementById("pg-level"); pg.innerHTML = "";
 pg.appendChild(el(`<div class="sub" style="padding:4px 2px">動作「無痛完成」就剔佢，全組完成先升 Level</div>`));
 LEVELS.forEach(lv=>{
  const done = lv.items.filter(x=>DB.levelChecks[lv.n+"_"+x]).length;
  const card = el(`<div class="card"><div class="lvhead"><h2 style="margin:0">${lv.name}</h2><span class="pill${DB.level===lv.n?" now":""}">${DB.level===lv.n?"而家喺度":done+"/"+lv.items.length}</span></div><div class="prog"><i style="width:${Math.round(done/lv.items.length*100)}%"></i></div></div>`);
  lv.items.forEach(x=>{
   const k = lv.n+"_"+x;
   const it = el(`<div class="item"><div class="box">✓</div><div class="mid"><div class="nm">${x}</div></div></div>`);
   if(DB.levelChecks[k]) it.classList.add("done");
   it.onclick = ()=>{
    DB.levelChecks[k]=!DB.levelChecks[k]; it.classList.toggle("done");
    const dn = lv.items.filter(y=>DB.levelChecks[lv.n+"_"+y]).length;
    if(dn===lv.items.length && DB.level===lv.n && lv.n<4){ DB.level=lv.n+1; alert("🎉 恭喜！升上 Level "+(lv.n+1)+"！"); renderLevel(); }
    save(); if(document.getElementById("pg-level").classList.contains("on") && dn!==lv.items.length) renderLevel();
   };
   card.appendChild(it);
  });
  pg.appendChild(card);
 });
 pg.appendChild(el(`<div class="card"><h2>Bulletproof Priority</h2>
  <div class="hist">🥇 肩胛控制 — 左肩痛 · Pull-up · Front Rack · 減手腕代償</div>
  <div class="hist">🥈 前臂耐受力 — 降 ECU overload · 恢復抓握懸吊</div>
  <div class="hist">🥉 胸椎活動 — Overhead · Wall Ball · Thruster</div>
  <div class="hist">4️⃣ 臀肌控制 — 減小腿代償 · 跑跳效率</div>
  <div class="hist">5️⃣ 足部穩定 — 落地與力線</div>
  <div class="note">堅持 8–12 星期，目標唔係淨係醫好今次 ECU，而係可以穩定加訓練量，唔使隔幾個月又因 overload 停練。</div></div>`));
}

const BY_ID = {}; LIB.forEach(x=>BY_ID[x.id]=x);
/* 別名 → id，長嘅先配（避免 "clean" 食咗 "power clean"） */
const ALIAS = [];
LIB.forEach(mv=>mv.a.forEach(al=>ALIAS.push([al,mv.id])));
ALIAS.sort((a,b)=>b[0].length-a[0].length);

/* ---------- 單位 ---------- */
const LB2KG = 0.45359237;
function toKg(w,u){ return u==="kg" ? +w : +w*LB2KG; }
function fromKg(kg,u){ return u==="kg" ? kg : kg/LB2KG; }
function fmtW(w,u){ const n=+w; return (Math.abs(n-Math.round(n))<0.05 ? Math.round(n) : n.toFixed(1)) + " " + u; }

/* ---------- 文字解析 ---------- */
function normLine(s){
 return String(s).toLowerCase()
  .replace(/[×✕╳]/g,"x")
  .replace(/[’‘`]/g,"'")
  .replace(/[|_•·▪●–—]/g," ")
  /* 中文單位 → 英文 */
  .replace(/組|set組/g," sets ").replace(/[次下]/g," reps ").replace(/回合|輪/g," rounds ")
  .replace(/公斤|千克/g,"kg").replace(/磅/g,"lb").replace(/秒/g," sec ").replace(/分鐘|分/g," min ")
  .replace(/公尺|米/g,"m").replace(/卡路里|卡/g," cal ")
  .replace(/\s+/g," ").trim();
}
const RE_CACHE = {};
function aliasRe(al){
 if(!RE_CACHE[al]) RE_CACHE[al] = new RegExp(
  "(^|[^a-z])" + al.replace(/[.*+?^${}()|[\]\\]/g,"\\$&").replace(/\s+/g,"[\\s\\-]*") + "(?:e?s)?(?![a-z])");
 return RE_CACHE[al];
}
function findMove(line){
 const L = normLine(line);
 for(const [al,id] of ALIAS) if(aliasRe(al).test(L)) return {id, alias:al};
 return null;
}
function schemeOf(str){
 const m = String(str).match(/(\d{1,3}(?:\s*-\s*\d{1,3}){1,7})/);
 if(!m) return null;
 const parts = m[1].split(/\s*-\s*/).map(Number);
 if(parts.length<2 || parts.some(x=>!(x>0&&x<=200))) return null;
 return parts;
}
/* 由一行文字抽 重量 / 組 / 次。搵到動作但無數字 → r 留 null，交返俾 parseWorkout 用上下文補 */
function parseLine(raw){
 const line = normLine(raw);
 if(line.length < 2) return null;
 const hit = findMove(line);
 if(!hit) return null;
 const mv = BY_ID[hit.id];
 /* 移除動作名，避免名入面嘅數字（例 "c2b"）被當成次數 */
 const nums = line.replace(aliasRe(hit.alias)," ");

 let unit = null, weight = null, sets = null, reps = null, scheme = null, dist = null, cal = null, secs = null;

 /* 明確單位重量：135 lb / 60kg / 135# / 135lbs / @135 */
 let m = nums.match(/(\d+(?:\.\d+)?)\s*(lbs?|kgs?|kilos?|#)(?![a-z])/);
 if(m){ weight = +m[1]; unit = /^k/.test(m[2]) ? "kg" : "lbs"; }
 if(weight==null){ m = nums.match(/@\s*(\d+(?:\.\d+)?)/); if(m) weight = +m[1]; }

 /* 距離 / 卡路里 / 時間 */
 m = nums.match(/(\d+(?:\.\d+)?)\s*(km|m|meters?|metres?|miles?|mi)(?![a-z])/);
 if(m) dist = +m[1] * (m[2]==="km"?1000 : /^mi/.test(m[2])?1609 : 1);
 m = nums.match(/(\d+)\s*(cals?|calories?)(?![a-z])/); if(m) cal = +m[1];
 m = nums.match(/(\d+)\s*(secs?|seconds?|s)(?![a-z])/); if(m) secs = +m[1];
 m = nums.match(/(\d+)\s*(mins?|minutes?)(?![a-z])/); if(m) secs = (secs||0) + (+m[1])*60;

 /* 21-15-9 類 rep scheme（要排除 "135-155" 咁嘅重量遞增） */
 const sc = schemeOf(nums.replace(/(\d+)\s*(lbs?|kgs?|#)/g," "));
 if(sc && !(sc.length===2 && Math.min(...sc)>60)){
  scheme = sc; sets = sc.length; reps = Math.round(sc.reduce((a,b)=>a+b,0)/sc.length);
 }

 /* AxBxC 形式：25 x 1 x 8（重量×組×次）或 5x5x135（組×次×重量） */
 if(sets==null || reps==null){
  const m3 = nums.match(/(\d{1,3}(?:\.\d+)?)\s*x\s*(\d{1,3})\s*x\s*(\d{1,3}(?:\.\d+)?)/);
  if(m3){
   const A=+m3[1], B=+m3[2], C=+m3[3];
   if(C > 40){ sets=A; reps=B; if(weight==null) weight=C; }        /* 5x5x135 */
   else if(A > 12){ if(weight==null) weight=A; sets=B; reps=C; }   /* 25x1x8 */
   else { sets=A; reps=B; if(weight==null) weight=C; }             /* 3x8x20 */
  }
 }
 /* AxB 形式 */
 if(sets==null || reps==null){
  for(const g of nums.matchAll(/(\d{1,3}(?:\.\d+)?)\s*x\s*(\d{1,3}(?:\.\d+)?)/g)){
   const A = +g[1], B = +g[2];
   if(A > 60 && B <= 30 && weight==null){ weight = A; reps = B; sets = sets||1; }      /* 225x5 */
   else if(A <= 20 && B <= 100){ sets = A; reps = B; }                                  /* 5x5 */
   else if(A <= 30 && B > 60 && weight==null){ reps = A; weight = B; sets = sets||1; }   /* 5x225 */
  }
 }
 /* "4 sets of 6" / "3 sets" / "10 reps" / "5 rounds" */
 m = nums.match(/(\d{1,2})\s*(?:sets?|rounds?)\s*(?:of|x)?\s*(\d{1,3})?/);
 if(m){ if(sets==null) sets = +m[1]; if(reps==null && m[2]) reps = +m[2]; }
 if(reps==null){ m = nums.match(/(\d{1,3})\s*reps?(?![a-z])/); if(m) reps = +m[1]; }
 /* CrossFit 式「15 Wall Balls 20#」/「Even: 3 Power Snatch 70kg」→ 名前數字 = 次數 */
 if(reps==null && dist==null && cal==null && secs==null){
  m = line.match(/(?:^|[:.)\-]\s*)(\d{1,3})\s+[a-z]/);
  if(m && +m[1] !== weight) reps = +m[1];
 }
 /* 淨得一個數 */
 if(reps==null && sets==null && weight==null && !dist && !cal && !secs){
  const only = nums.match(/\d{1,3}/g);
  if(only && only.length===1 && +only[0] <= 200){ reps = +only[0]; sets = 1; }
 }
 /* 無單位嘅剩餘大數 = 重量（例「Bench 5-5-5 155」） */
 if(weight==null && !mv.cardio && !mv.bw && reps!=null){
  const used = new Set([reps,sets,dist,cal,secs].filter(x=>x!=null).map(Number));
  (scheme||[]).forEach(x=>used.add(x));
  const cand = (nums.match(/\d+(?:\.\d+)?/g)||[]).map(Number)
   .filter(x=>x>=40 && x<=800 && !used.has(x));
  if(cand.length) weight = Math.max(...cand);
 }

 return {
  ex: mv.id, name: mv.n,
  w: weight, u: unit || (weight!=null ? "AUTO" : null),
  s: sets, r: reps,
  scheme, dist, cal, secs, raw: String(raw).trim()
 };
}
/* 淨係得 rep scheme / rounds 嘅一行（做下面幾個動作嘅共同處方） */
function contextOf(raw){
 const line = normLine(raw);
 if(findMove(line)) return null;
 const sc = schemeOf(line);
 if(sc && Math.min.apply(null,sc) < 45 && /^[\s\d\-x×+]*(?:reps?|rounds?|for time|rft|)?[\s\d\-]*$/.test(line.replace(/\d+\s*-\s*/g,"").replace(/\d+/g,""))) return {scheme:sc, sets:sc.length, reps:Math.round(sc.reduce((a,b)=>a+b,0)/sc.length)};
 let m = line.match(/^(\d{1,2})\s*(?:rounds?|rft|sets?)\b/);
 if(m) return {sets:+m[1]};
 m = line.match(/^(\d{1,2})\s*x\s*$/); if(m) return {sets:+m[1]};
 return null;
}
/* 一行入面幾組唔同重量：「DB Bench Press 20lbs x2x8, 25 x 1 x 8」
   → 拆成幾條「動作名 + 每組」再逐條解析 */
function expandLine(raw){
 const L = normLine(raw);
 const hit = findMove(L);
 if(!hit) return [raw];
 const rest = L.replace(aliasRe(hit.alias), " ").trim();
 const parts = rest.split(/\s*[,，;；]\s*|\s+\/\s+|\s+then\s+/).map(s=>s.trim()).filter(s=>/\d/.test(s));
 if(parts.length < 2) return [raw];
 return parts.map(p=>hit.alias + " " + p);
}
/* 淨係得數字嘅一行（例「225 x 5」「185lb 3x3」）→ 跟返上面嗰個動作 */
function isBareSet(raw){
 const L = normLine(raw);
 if(!/\d/.test(L)) return false;
 if(findMove(L)) return false;
 return /^[\s\d.,x@()\-\/]*(?:lbs?|kgs?|#|reps?|sets?|s|sec|secs|min|mins|m|km|cals?)?[\s\d.,x@()\-\/]*$/.test(L)
     && /\d\s*(?:x|@|lbs?|kgs?|#)|\dx\d/.test(L);
}
function parseWorkout(text, defUnit){
 const out = [];
 let ctx = null, lastAlias = null;
 String(text).split(/[\n\r;]+/).forEach(ln=>{
  if(!ln || !ln.trim()) return;
  const c = contextOf(ln);
  if(c){ ctx = c; return; }
  if(lastAlias && isBareSet(ln)) ln = lastAlias + " " + normLine(ln);
  const hit0 = findMove(ln);
  if(hit0) lastAlias = hit0.alias;
  const subs = expandLine(ln);
  const grp = [];
  subs.forEach(sub=>{
   const p = parseLine(sub);
   if(!p) return;
   const mv = BY_ID[p.ex];
   if(ctx){
    if(p.r==null && ctx.reps!=null){ p.r = ctx.reps; p.scheme = ctx.scheme||null; }
    if(p.s==null) p.s = ctx.sets || 1;
   }
   if(p.s==null) p.s = 1;
   if(p.secs!=null && p.r===p.secs) p.r = null;   /* "4x30 sec" → 30 係秒唔係次 */
   if(mv.cardio){ if(!p.dist && !p.cal && !p.secs && !p.r) return; }
   else if(p.r==null && p.secs==null) return;
   p.raw = String(ln).trim();
   grp.push(p);
  });
  /* 同一行入面，有明確單位嘅組負責定其他組嘅單位（25 跟返 20lbs） */
  const explicit = grp.find(p=>p.u && p.u!=="AUTO");
  grp.forEach(p=>{ if(p.u==="AUTO" || !p.u) p.u = explicit ? explicit.u : defUnit; });
  grp.forEach(p=>out.push(p));
 });
 const seen = new Set();
 return out.filter(p=>{ const k=[p.ex,p.w,p.s,p.r,p.dist,p.cal,p.secs].join("|"); if(seen.has(k))return false; seen.add(k); return true; });
}

/* ---------- 負荷計算 ---------- */
/* 一條記錄 → 總 tonnage（kg） */
function entryLoadKg(e, bwKg){
 const mv = BY_ID[e.ex]; if(!mv) return 0;
 if(mv.cardio){
  const cal = e.cal || 0, dist = e.dist || 0, secs = e.secs || 0;
  const one = cal*8 + dist*0.4 + secs*2.5 + (e.r&&!cal&&!dist&&!secs ? e.r*2 : 0);
  return one * (e.s || 1);
 }
 const ext = e.w!=null ? toKg(e.w, e.u||"lbs") : 0;
 const load = (mv.bw ? bwKg*mv.bw : 0) + ext;
 const sets = e.s || 1;
 const reps = e.scheme ? e.scheme.reduce((a,b)=>a+b,0) : (e.r||0)*sets;
 /* 等長/負重行：每 10 秒當 1 下 */
 const isoReps = e.secs ? (e.secs/10)*sets : 0;
 return (load||bwKg*.3) * (reps + isoReps);
}
/* 期間 → 每肌群 tonnage + 模式 + modality */
function analyze(entries, bwKg){
 const mus = {}, pat = {}, mod = {}, sets = {};
 MUS_ORDER.forEach(k=>mus[k]=0);
 entries.forEach(e=>{
  const mv = BY_ID[e.ex]; if(!mv) return;
  const L = entryLoadKg(e, bwKg);
  for(const k in mv.m) mus[k] = (mus[k]||0) + L*mv.m[k];
  pat[mv.pat] = (pat[mv.pat]||0) + L;
  mod[mv.mod] = (mod[mv.mod]||0) + (e.s||1);
  sets[mv.id] = (sets[mv.id]||0) + (e.s||1);
 });
 const total = Object.values(mus).reduce((a,b)=>a+b,0);
 return {mus, pat, mod, sets, total};
}

function loadScript(src){
 return new Promise((res,rej)=>{
  const s=document.createElement("script"); s.src=src; s.async=true;
  s.onload=res; s.onerror=()=>rej(new Error("load fail "+src));
  document.head.appendChild(s);
 });
}
let tessP = null;
function loadTess(){
 if(window.Tesseract) return Promise.resolve(window.Tesseract);
 if(tessP) return tessP;
 const urls = [
  "https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js",
  "https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.1/tesseract.min.js",
  "https://unpkg.com/tesseract.js@5.1.1/dist/tesseract.min.js"
 ];
 tessP = urls.reduce((p,u)=>p.catch(()=>loadScript(u).then(()=>{ if(!window.Tesseract) throw new Error("no global"); return window.Tesseract; })),
  Promise.reject()).catch(e=>{ tessP=null; throw e; });
 return tessP;
}
/* 白板/螢幕相：放大 + 灰階 + 對比拉伸，OCR 準好多 */
function prepImage(file){
 return new Promise((res,rej)=>{
  const rd=new FileReader();
  rd.onerror=()=>rej(new Error("read fail"));
  rd.onload=()=>{
   const im=new Image();
   im.onerror=()=>rej(new Error("img fail"));
   im.onload=()=>{
    const target = 1600;
    const sc = Math.min(2.2, Math.max(1, target/Math.max(im.width,im.height)));
    const cv=document.createElement("canvas");
    cv.width=Math.round(im.width*sc); cv.height=Math.round(im.height*sc);
    const cx=cv.getContext("2d");
    cx.drawImage(im,0,0,cv.width,cv.height);
    try{
     const d=cx.getImageData(0,0,cv.width,cv.height), p=d.data;
     let mn=255, mx=0;
     for(let i=0;i<p.length;i+=4){ const g=(p[i]*.3+p[i+1]*.59+p[i+2]*.11); if(g<mn)mn=g; if(g>mx)mx=g; }
     const rng = Math.max(1, mx-mn);
     for(let i=0;i<p.length;i+=4){
      let g=(p[i]*.3+p[i+1]*.59+p[i+2]*.11);
      g=(g-mn)/rng*255;
      g = g<110 ? g*0.55 : 40+g*0.85;      /* 拉開黑白 */
      g = Math.max(0,Math.min(255,g));
      p[i]=p[i+1]=p[i+2]=g;
     }
     cx.putImageData(d,0,0);
    }catch(e){}
    res({full: cv.toDataURL("image/jpeg",0.92), thumb: thumbOf(im)});
   };
   im.src=rd.result;
  };
  rd.readAsDataURL(file);
 });
}
function thumbOf(im){
 const s=Math.min(1,600/Math.max(im.width,im.height));
 const c=document.createElement("canvas");
 c.width=Math.round(im.width*s); c.height=Math.round(im.height*s);
 c.getContext("2d").drawImage(im,0,0,c.width,c.height);
 return c.toDataURL("image/jpeg",0.7);
}

  dIn.onchange = syncDate;

  function drawRows(){
   rowsBox.innerHTML = "";
   if(!rows.length){ rowsBox.appendChild(el(`<div class="empty">未解析到動作。<br>可以手動加，或者改上面段文字再解析。</div>`)); return; }
   rows.forEach((r,i)=>{
    const mv = BY_ID[r.ex]||{};
    const row = el(`<div style="border-top:1px solid var(--line);padding:9px 0">

      </div>

       <select class="u" style="width:64px"><option value="lbs">lbs</option><option value="kg">kg</option></select>

  /* 有數字但認唔到動作嘅行 → 多數係動作庫未有 */
  function unmatched(text){
   return String(text).split(/[\n\r;]+/).map(s=>s.trim()).filter(s=>{
    if(s.length<3) return false;
    const L = normLine(s);
    if(!/\d/.test(L)) return false;
    if(findMove(L)) return false;
    if(contextOf(s)) return false;
    if(/^(wod|amrap|emom|rft|for time|rest|每分鐘|每組|cash|buy)/.test(L)) return false;
    return /[a-z一-鿿]{3,}/.test(L);
   });
  }
  function drawUnmatched(){
   const box = src.querySelector("#unm"); box.innerHTML = "";
   const u = unmatched(ta.value);
   if(!u.length) return;
   box.appendChild(el(`<div class="warnbox warn" style="margin-top:10px">🤔 呢 ${u.length} 行有數字但認唔到動作。如果係動作庫未有（例 Goblet Squat Jump），撳「＋ 加入動作庫」教一次，以後 OCR 就自動認得。</div>`));
   u.forEach(line=>{
    const guess = line.replace(/[\d.．]+\s*(lbs?|kgs?|#|reps?|sets?|組|次|秒|sec|min|m|cal)?/gi," ")
                      .replace(/[x×@\-–—:：()]+/g," ").replace(/\s+/g," ").trim();
    const r = el(`<div class="exrow"><span class="en">${esc(line)}</span><button class="mini pri">＋ 加入動作庫</button></div>`);
    r.querySelector("button").onclick = ()=>{
     openMoveEditor(null, ()=>{ reparse(); }, guess);
    };
    box.appendChild(r);
   });
  }
  function reparse(){
   rows = parseWorkout(ta.value, DB.unit);
   drawRows(); drawUnmatched();
   log.textContent = rows.length ? "✅ 解析到 "+rows.length+" 個動作" : "⚠️ 認唔到動作，試下手動加";
  }
  if(presetText) reparse(); else drawRows();

  src.querySelector("#bParse").onclick = reparse;
  src.querySelector("#bDemo").onclick = ()=>{
   ta.value = "Back Squat 5x5 @ 185 lb\nBB Bench Press 3x8 135lbs\n21-15-9\nThrusters 95lb\nPull-ups\n500m Row";
   reparse();
  };
  src.querySelector("#bAddRow").onclick = ()=>{ rows.push({ex:"bench",name:"BB Bench Press",w:null,u:DB.unit,s:3,r:5}); drawRows(); };

  src.querySelector("#fCap").onchange = function(){
   const f = this.files && this.files[0]; this.value="";
   if(!f) return;
   log.textContent = "📷 處理相片…";
   prepImage(f).then(({full,thumb})=>{
    pendingThumb = thumb;
    log.textContent = "⏳ 載入 OCR 引擎（首次要下載約 2–5MB，之後會 cache）…";
    return loadTess().then(T=>{
     log.textContent = "🔎 辨識中… 0%";
     return T.recognize(full, "eng", {logger: p=>{
      if(p.status==="recognizing text") log.textContent = "🔎 辨識中… "+Math.round(p.progress*100)+"%";
      else log.textContent = "⏳ "+p.status;
     }});
    });
   }).then(res=>{
    const txt = (res && res.data && res.data.text || "").trim();
    ta.value = (ta.value ? ta.value+"\n" : "") + txt;
    reparse();
    log.textContent = "✅ OCR 完成，解析到 "+rows.length+" 個動作。認錯咗就直接改上面段文字或下面每一行。";
   }).catch(e=>{
    log.textContent = "❌ OCR 用唔到（"+(e&&e.message||e)+"）。\n可能無網絡。你可以喺 CrossFit app 度 copy 段文字，貼落上面個框再撳「重新解析」。";
   });
  };

  bSave.onclick = ()=>{
   if(!rows.length){ alert("無嘢可以加"); return; }
   const tgt = dIn.value || TKEY;
   const L = liftsOf(tgt);
   let n = 0;
   rows.forEach(r=>{
    const mv = BY_ID[r.ex]||{};
    if(!mv.cardio && r.r==null && r.secs==null && !r.scheme) return;
    L.push({id:uid(), ex:r.ex, w:(r.w===""||r.w==null)?null:+r.w, u:r.u||DB.unit,
            s:+r.s||1, r:r.r==null?null:+r.r, scheme:r.scheme||null,
            dist:r.dist||null, cal:r.cal||null, secs:r.secs||null, raw:r.raw||""});
    n++;
   });
   if(pendingThumb){
    const iid = uid();
    imgPut(iid, pendingThumb).then(()=>{
     const d=day(tgt); d.caps = d.caps||[]; d.caps.push(iid); save(true);
    }).catch(()=>{});
   }
   save(); closeS2(); toast("✅ "+(tgt===TKEY?"":tgt+" ")+"加咗 "+n+" 個動作");
   renderToday(); if(document.getElementById("pg-lift").classList.contains("on")) renderLift();
  };
 });

/* ============================================================
   力量頁
   ============================================================ */
/* 一個動作嘅所有記錄（新→舊） */
function historyOf(exId){
 return allLifts().filter(e=>e.ex===exId).sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:0);
}
/* 同一日同一個動作嘅所有組（輕→重） */
function groupsOn(exId, date){
 return ((DB.days[date]||{}).lifts||[]).filter(e=>e.ex===exId)
  .sort((a,b)=>(a.w!=null?toKg(a.w,a.u||"lbs"):-1)-(b.w!=null?toKg(b.w,b.u||"lbs"):-1));
}
/* 「20 lbs ×2×8 · 25 lbs ×1×8」 */
function groupsTxt(gs){
 return gs.map(e=>{
  const mv = BY_ID[e.ex]||{};
  if(mv.cardio) return entryTxt(e);
  const w = dispW(e);
  const rep = e.scheme ? e.scheme.join("-") : (e.r!=null ? e.r : (e.secs?e.secs+"s":"?"));
  return (w!=null ? fmtW(w,DB.unit) : "體重") + " ×" + (e.s||1) + "×" + rep;
 }).join(" · ");
}
/* 每次訓練嘅「working set」= 嗰日最重嗰組 */
function sessionsOf(exId){
 const byDate = {};
 historyOf(exId).forEach(e=>{
  const kg = e.w!=null ? toKg(e.w,e.u||"lbs") : -1;
  const cur = byDate[e.date];
  const score = kg>=0 ? kg : entryLoadKg(e, BWKG())/1000;
  if(!cur || score > cur._score) byDate[e.date] = Object.assign({_score:score,_kg:kg}, e);
 });
 return Object.keys(byDate).sort().reverse().map(k=>byDate[k]);
}
function bestOf(exId){
 let b=null;
 historyOf(exId).forEach(e=>{ if(e.w==null) return; const kg=toKg(e.w,e.u||"lbs"); if(!b||kg>b.kg) b={kg,e}; });
 return b;
}
function sparkSVG(vals){
 if(vals.length<2) return "";
 const mn=Math.min(...vals), mx=Math.max(...vals), rng=(mx-mn)||1, W=300, H=34, p=4;
 const pts = vals.map((v,i)=>[p+(W-2*p)*i/(vals.length-1), H-p-(H-2*p)*(v-mn)/rng]);
 const d = pts.map((q,i)=>(i?"L":"M")+q[0].toFixed(1)+" "+q[1].toFixed(1)).join(" ");
 const up = vals[vals.length-1] >= vals[0];
 const col = up ? "var(--good)" : "var(--warn)";
 return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
  <path d="${d}" fill="none" stroke="${col}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
  ${pts.map(q=>`<circle cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="2.6" fill="${col}"/>`).join("")}
 </svg>`;
}

 const q = liftQ.trim().toLowerCase();

 list.forEach(({id,ss})=>{

  const row = el(`<div class="lift">

    ${tgHtml}
   </div>`);
  row.onclick = ()=>openMoveDetail(id);

function openMoveDetail(exId){
 const mv = BY_ID[exId];
 openS2(mv.n, body=>{
  const ss = sessionsOf(exId), hist = historyOf(exId), best = bestOf(exId), tg = DB.targets[exId]||{};
  const cur = ss[0];
  const musTxt = Object.keys(mv.m).sort((a,b)=>mv.m[b]-mv.m[a])
   .map(k=>MUS[k]+" "+Math.round(mv.m[k]*100)+"%").join(" · ");
  body.appendChild(el(`<div>
    <div class="big" style="margin:6px 0 2px">${cur?entryTxt(cur):"—"}</div>

 t = Math.min(1,t);

}

/* ============================================================
   康復動作 → 部位對照
   ============================================================ */
/* 由處方（"2×15" / "5×30秒" / "3×20m"）估算份量單位 */
function rxVolume(rx){
 const L = normLine(rx||"");
 if(/每週|weekly/.test(L)) return 10;
 let m = L.match(/(\d{1,2})\s*x\s*(\d{1,3})/);
 if(m){
  const sets = +m[1], per = +m[2];
  if(/sec|秒/.test(L)) return sets * Math.max(1, per/10);   /* 等長：10秒 = 1下 */
  return sets * per;
 }
 m = L.match(/(\d{1,3})\s*(?:sec|秒)/); if(m) return Math.max(1, +m[1]/10);
 m = L.match(/(\d{1,3})\s*min/); if(m) return Math.max(1, +m[1]*6);
 m = L.match(/(\d{1,3})/); if(m) return +m[1];
 return 10;
}
/* 一個康復動作 → 肌群分佈 */
function itemMus(it){
 const hit = findMove(it.name);
 if(!hit) return null;
 const mv = BY_ID[hit.id]; if(!mv) return null;
 const vol = rxVolume(it.rx);
 const mus = {};
 for(const k in mv.m) mus[k] = vol * mv.m[k];
 return {mus, vol, ex:hit.id, name:mv.n};
}
/* 一個 block → 主要練邊度 */
function blockMuscles(b){
 const mus = {};
 let known = 0;
 (b.items||[]).forEach(it=>{
  const r = itemMus(it);
  if(!r) return;
  known++;
  for(const k in r.mus) mus[k] = (mus[k]||0) + r.mus[k];
 });
 const top = Object.keys(mus).sort((a,b2)=>mus[b2]-mus[a]);
 return {mus, top, known, total:(b.items||[]).length};
}
/* 一段日子入面，真係剔咗嘅康復動作 → 部位覆蓋 */
function rehabCoverage(ks){
 const mus = {}, byItem = {};
 ks.forEach(k=>{
  const dd = DB.days[k]; if(!dd) return;
  const ch = dd.checks || {};
  blocksFor(k).forEach(b=>{
   b.items.forEach(it=>{
    if(!ch[it.id]) return;
    const r = itemMus(it);
    if(!r) return;
    for(const key in r.mus) mus[key] = (mus[key]||0) + r.mus[key];
    if(!byItem[it.id]) byItem[it.id] = {name:it.name, rx:it.rx, ex:r.ex, mus:r.mus, units:0, days:0, block:b.name};
    byItem[it.id].units += r.vol; byItem[it.id].days++;
   });
  });
 });
 const total = Object.values(mus).reduce((a,b)=>a+b,0);
 return {mus, byItem, total};
}
/* 康復覆蓋卡 */
function rehabMusCard(){
 const N = anaPeriod;
 const ks = daysBack(N);
 const C = rehabCoverage(ks);
 const items = Object.values(C.byItem);
 const c = el(`<div class="card"><h2>康復訓練練緊咩部位<span class="tag">${N===7?"本週":N===30?"本月":"3個月"}</span></h2>
   <div class="goal">只計你真係剔咗嘅康復動作（Phase / Block），同力量訓練分開計。</div></div>`);
 if(!C.total){
  c.appendChild(el(`<div class="empty">呢 ${N} 日仲未剔過康復動作。</div>`));
  return c;
 }
 const max = Math.max(...MUS_ORDER.map(k=>C.mus[k]||0), 1);
 MUS_ORDER.filter(k=>k!=="cardio").forEach(k=>{
  const v = C.mus[k]||0;
  const row = el(`<div class="mrow"${v>0?' style="cursor:pointer"':""}><span class="mn">${MUS[k]}</span>
    <span class="mb"><i style="width:${Math.round(v/max*100)}%;background:${heatColor(v/max)}"></i></span>
    <span class="mv" style="width:72px">${v>0?Math.round(v)+" 下":"–"}</span></div>`);
  if(v>0) row.onclick = ()=>openRehabMus(k, ks);
  c.appendChild(row);
 });
 c.appendChild(el(`<div class="note">單位＝完成次數（等長動作每 10 秒當 1 下）。撳部位睇邊個動作練緊佢。</div>`));

 /* 未覆蓋提示 */
 const cold = MUS_ORDER.filter(k=>k!=="cardio" && !(C.mus[k]>max*0.05));
 if(cold.length) c.appendChild(el(`<div class="warnbox warn">康復動作幾乎冇掂到：${cold.map(k=>MUS[k]).join("、")}。如果嗰度有唔妥，可以喺編輯模式加返動作。</div>`));
 return c;
}
function openRehabMus(key, ks){
 const C = rehabCoverage(ks);
 const scored = Object.values(C.byItem)
   .map(x=>({x, v:(x.mus[key]||0) * x.days}))
   .filter(o=>o.v>0).sort((a,b)=>b.v-a.v);
 openS2(MUS[key] + " · 康復動作", body=>{
  const tot = scored.reduce((s,o)=>s+o.v,0);
  body.appendChild(el(`<div class="big" style="margin:6px 0 2px">${Math.round(tot)} 下</div>
    <div class="sub">${scored.length} 個康復動作練緊${MUS[key]}</div>`));
  const max = scored.length ? scored[0].v : 1;
  scored.forEach(({x,v})=>{
   body.appendChild(el(`<div style="border-top:1px solid var(--line);padding:9px 2px">
     <div style="display:flex;justify-content:space-between;gap:8px">
      <span style="font-size:14px">${esc(x.name)}</span><b>${Math.round(v/tot*100)}%</b></div>
     <span class="mb" style="display:flex;height:12px;background:var(--card2);border-radius:4px;overflow:hidden;margin-top:5px">
      <i style="display:block;height:100%;width:${Math.round(v/max*100)}%;background:${heatColor(v/max)}"></i></span>
     <div class="meta"><span>${esc(x.block)} · ${esc(x.rx||"")}</span><span>做咗 ${x.days} 日</span></div></div>`));
  });
 });
}

/* ---------- 邊啲動作貢獻咗呢個部位 ---------- */
function musBreakdown(entries, key, bw){
 const by = {};
 entries.forEach(e=>{
  const mv = BY_ID[e.ex]; if(!mv || !mv.m[key]) return;
  const kg = entryLoadKg(e, bw) * mv.m[key];
  if(!by[e.ex]) by[e.ex] = {ex:e.ex, kg:0, sets:0, days:new Set(), share:mv.m[key]};
  by[e.ex].kg += kg; by[e.ex].sets += (e.s||1); by[e.ex].days.add(e.date);
 });
 const arr = Object.values(by).sort((a,b)=>b.kg-a.kg);
 const tot = arr.reduce((s,x)=>s+x.kg,0);
 arr.forEach(x=>x.pct = tot ? x.kg/tot*100 : 0);
 return {arr, tot};
}
function openMusDetail(key, N){
 const bw = BWKG(), entries = liftsInDays(daysBack(N));
 const {arr, tot} = musBreakdown(entries, key, bw);
 openS2(MUS[key] + " · " + (N===7?"本週":N===30?"本月":"3個月"), body=>{
  body.appendChild(el(`<div class="big" style="margin:6px 0 2px">${tonneTxt(tot)}</div>
    <div class="sub">總負荷 · ${arr.length} 個動作貢獻</div>`));
  if(!arr.length){ body.appendChild(el(`<div class="empty">呢段時間冇練到${MUS[key]}。</div>`)); return; }
  const max = arr[0].kg;
  arr.forEach(x=>{
   const mv = BY_ID[x.ex]||{};
   const r = el(`<div style="border-top:1px solid var(--line);padding:9px 2px">
     <div class="top" style="display:flex;justify-content:space-between;gap:8px">
      <span style="font-size:14px">${esc(mv.n||x.ex)}</span>
      <b style="font-size:14px">${Math.round(x.pct)}%</b></div>
     <span class="mb" style="display:flex;height:12px;background:var(--card2);border-radius:4px;overflow:hidden;margin-top:5px">
      <i style="display:block;height:100%;width:${Math.round(x.kg/max*100)}%;background:${heatColor(x.kg/max)}"></i></span>
     <div class="meta"><span>${tonneTxt(x.kg)} · ${x.sets}組 · ${x.days.size}日</span>
      <span>呢個動作 ${Math.round(x.share*100)}% 落${MUS[key]}</span></div>
    </div>`);
   r.onclick = ()=>{ closeS2(); openMoveDetail(x.ex); };
   body.appendChild(r);
  });
  body.appendChild(el(`<div class="note" style="margin-top:12px">百分比 = 呢個動作佔${MUS[key]}總負荷嘅比例。撳任何一行入去睇該動作嘅重量進度。</div>`));
 });
}

/* ---------- 通用 SVG 折線圖 ---------- */
function lineChartSVG(labels, series){
 const W=340, H=150, padL=26, padR=8, padT=10, padB=22;
 const n = labels.length, iw = W-padL-padR, ih = H-padT-padB;
 const x = i => n<2 ? padL+iw/2 : padL + iw*i/(n-1);
 const y = v => padT + ih*(1-v);
 let g = "";
 for(let t=0;t<=1;t+=0.25) g += `<line x1="${padL}" y1="${y(t).toFixed(1)}" x2="${W-padR}" y2="${y(t).toFixed(1)}" stroke="var(--line)" stroke-width="1"/>`;
 g += [0,0.5,1].map(t=>`<text x="2" y="${(y(t)+4).toFixed(1)}" fill="var(--dim)" font-size="9">${Math.round(t*100)}</text>`).join("");
 series.forEach(s=>{
  const pts = s.vals.map((v,i)=>v==null?null:[x(i),y(v)]).filter(Boolean);
  if(!pts.length) return;
  g += `<polyline fill="none" stroke="${s.color}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" points="${pts.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ")}"/>`;
  g += pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.8" fill="${s.color}"/>`).join("");
 });
 g += labels.map((l,i)=>i%2||n<=6?`<text x="${x(i).toFixed(1)}" y="${H-6}" fill="var(--dim)" font-size="8.5" text-anchor="middle">${esc(l)}</text>`:"").join("");
 return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;margin-top:6px">${g}</svg>`;
}

/* ---------- 每週統計 ---------- */
function weekKeys(back){            /* back=0 → 最近7日 */
 return daysBack(7, back*7);
}
function weekStats(back){
 const ks = weekKeys(back), bw = BWKG();
 const days = ks.map(k=>DB.days[k]).filter(Boolean);
 const logged = ks.filter(k=>DB.days[k] && (doneCount(k)>0 || (DB.days[k].lifts||[]).length));
 const pcts = ks.filter(k=>DB.days[k]).map(k=>dayPct(k));
 const hit = ks.filter(k=>dayPct(k)>=0.8).length;
 const L = liftsInDays(ks);
 const A = analyze(L, bw);
 const feels = days.map(d=>d.feel).filter(v=>v!=null);
 const pains = {};
 PARTS().forEach(p=>{
  const vs = days.map(d=>painGet(d,p.id)).filter(v=>v!=null);
  if(vs.length) pains[p.id] = vs.reduce((a,b)=>a+b,0)/vs.length;
 });
 return {
  ks, from:ks[ks.length-1], to:ks[0],
  loggedDays: logged.length,
  hitDays: hit,
  avgPct: pcts.length ? pcts.reduce((a,b)=>a+b,0)/pcts.length : 0,
  sets: L.reduce((s,e)=>s+(e.s||1),0),
  tonnage: A.total,
  mus: A.mus, mod: A.mod,
  feel: feels.length ? feels.reduce((a,b)=>a+b,0)/feels.length : null,
  pains
 };
}

/* ---------- 康復進度（折線） ---------- */
function rehabCard(){
 const NW = 10;
 const ws = [];
 for(let i=NW-1;i>=0;i--) ws.push(weekStats(i));
 const labels = ws.map(w=>w.to.slice(5).replace("-","/"));
 const series = [{name:"打卡完成率", color:"#3ddc84", vals:ws.map(w=>w.loggedDays?w.avgPct:null)}];
 PARTS().forEach(p=>{
  const vals = ws.map(w=>w.pains[p.id]!=null ? w.pains[p.id]/10 : null);
  if(vals.some(v=>v!=null)) series.push({name:p.n+"（痛）", color:p.c, vals});
 });
 const c = el(`<div class="card"><h2>康復進度<span class="tag">近 ${NW} 星期</span></h2>
   <div class="goal">綠線向上 + 痛感線向落 = 走緊啱路</div>
   ${lineChartSVG(labels, series)}
   <div class="legend">${series.map(s=>`<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join("")}</div></div>`);

 /* 一句總結 */
 const now = ws[NW-1], old = ws[Math.max(0,NW-5)];
 const msgs = [];
 if(now.loggedDays && old.loggedDays){
  const dp = (now.avgPct-old.avgPct)*100;
  if(dp > 8) msgs.push(["ok",`打卡完成率 4 週內由 ${Math.round(old.avgPct*100)}% 升到 ${Math.round(now.avgPct*100)}% 📈`]);
  else if(dp < -8) msgs.push(["warn",`打卡完成率由 ${Math.round(old.avgPct*100)}% 跌到 ${Math.round(now.avgPct*100)}% — 係咪計劃太密？可以喺編輯模式減啲動作。`]);
 }
 PARTS().forEach(p=>{
  const a = now.pains[p.id], b = old.pains[p.id];
  if(a==null || b==null) return;
  if(b-a >= 1) msgs.push(["ok",`${p.n} 由 ${b.toFixed(1)} 跌到 ${a.toFixed(1)} — 有進步 💪`]);
  else if(a-b >= 1) msgs.push(["bad",`${p.n} 由 ${b.toFixed(1)} 升到 ${a.toFixed(1)} — 留意訓練量。`]);
 });
 const streakW = (()=>{ let s=0; for(let i=0;i<NW;i++){ const wk=ws[NW-1-i]; if(wk.hitDays>=4) s++; else break; } return s; })();
 if(streakW) msgs.push(["ok",`連續 ${streakW} 個星期有 4 日以上達標 🔥`]);
 msgs.slice(0,4).forEach(([k,t])=>c.appendChild(el(`<div class="warnbox ${k}">${t}</div>`)));
 return c;
}

  const painTxt = Object.keys(w.pains).map(id=>{

  const r = el(`<div class="lift">

 if(g28){
  const ks = last(28);
  [...g28.children].forEach((cell,i)=>{
   const k = ks[i];
   cell.style.cursor = "pointer";
   if(DB.days[k]) cell.style.outline = "1px solid rgba(255,255,255,.12)";
   cell.title = k;
   cell.onclick = ()=>openDayDetail(k);
  });
  g28.parentElement.appendChild(el(`<div class="note">撳任何一格睇嗰日做過咩。</div>`));
 }

 pg.appendChild(rehabCard());
 pg.appendChild(rehabMusCard());
 pg.appendChild(weeklyCard());
 pg.appendChild(renderAnalysis());
 if(backup) pg.appendChild(backup);
};

document.querySelector('[data-pg=lift]').addEventListener("click", renderLift);

/* ---------- Tabs ---------- */
document.querySelectorAll(".tabs button").forEach(b=>{
 b.onclick = ()=>{
  document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("on"));
  document.querySelectorAll(".page").forEach(x=>x.classList.remove("on"));
  b.classList.add("on");
  document.getElementById("pg-"+b.dataset.pg).classList.add("on");
  if(b.dataset.pg==="prog") renderProg();
  if(b.dataset.pg==="assess") renderAssess();
  if(b.dataset.pg==="level") renderLevel();
  if(b.dataset.pg==="today") renderToday();
 };
});
